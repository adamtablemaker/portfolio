<!DOCTYPE html>
<html>
<head>
  <title>Adam Owens</title>

<style>
body {
  font-family: sans-serif;
  max-width: 1000px;
  margin: 70px auto;
  line-height: 1.5;
}

/* TOP */
.header {
  text-align: center;
  margin-bottom: 80px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px 40px;
  margin-bottom: 60px;
}

.project {
  text-align: center;
}

.project img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #eee;
}

.project-title {
  margin-top: 10px;
  font-weight: 600;
  font-size: 14px;
}

/* DIVIDER */
.divider {
  border-top: 1px solid #ccc;
  margin: 60px 0;
}

/* ARCHIVE GRID */
.archive {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.archive img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  filter: grayscale(100%);
  transition: 0.2s;
}

.archive img:hover {
  filter: grayscale(0%);
  transform: scale(1.02);
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>Adam Owens</h1>
  <p>Geometry-driven systems spanning computation, structural behavior, and fabrication.</p>
  <a href="#">GitHub</a>
</div>

  </div>

  </div>

  <div class="project">
    <img src="images/modular.jpg">
    <div class="project-title">Modular Fabrication System</div>
  </div>

</div>

<div class="divider"></div>
